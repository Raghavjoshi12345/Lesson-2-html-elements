<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Bold vs Strong</h2>
    <p><strong>Tomato</strong> is a <bold>fruit</bold></p>
    <h2>Italic vs Emphasis</h2>
    <p><i>Tomato</i> is a <em>fruit</em>
    </p>
<h2>Highlight and Small</h2>
<p><mark>Tomato</mark> is a <small>fruit</small>
</p>
<h2>Deleted Text</h2>
<p><del>Tomato</del> is a fruit
</p>
<h2>Superscript and Subscript
</h2>
<p><sup>Tomato</sup> is a <sub>fruit</sub>
</p>

</body>
</html>
